app = "net-recovery-app"
primary_region = "iad"

[build]

[env]
  APP_ENV = "production"
  APP_DEBUG = "false"
  APP_URL = "https://net-recovery-app.fly.dev"
  DB_CONNECTION = "sqlite"
  SESSION_DRIVER = "database"
  CACHE_STORE = "database"
  QUEUE_CONNECTION = "database"
  LOG_CHANNEL = "stderr"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[mounts]
  source = "data"
  destination = "/var/www/html/database"
