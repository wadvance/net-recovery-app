services:
  postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evolution}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evolutionpass}
      POSTGRES_DB: ${POSTGRES_DB:-evolution}
    volumes:
      - evolution-pgdata:/var/lib/postgresql/data
    networks:
      - evolution-net

  redis:
    image: redis:7-alpine
    container_name: evolution-redis
    restart: unless-stopped
    volumes:
      - evolution-redisdata:/data
    networks:
      - evolution-net

  evolution:
    # Evolution API v2 (Baileys). Fija la versión en producción tras la primera prueba.
    image: atendai/evolution-api:v2.2.1
    container_name: evolution-api
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    ports:
      - "${EVOLUTION_PORT:-8080}:8080"
    environment:
      SERVER_URL: ${SERVER_URL:-http://localhost:8080}
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?Define EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgres://${POSTGRES_USER:-evolution}:${POSTGRES_PASSWORD:-evolutionpass}@postgres:5432/${POSTGRES_DB:-evolution}
      REDIS_ENABLED: "true"
      REDIS_URI: redis://redis:6379
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379
      QRCODE_LIMIT: ${QRCODE_LIMIT:-30}
      WEBHOOK_GLOBAL_ENABLED: "false"
    volumes:
      - evolution-instances:/evolution/instances
    networks:
      - evolution-net

volumes:
  evolution-pgdata:
  evolution-redisdata:
  evolution-instances:

networks:
  evolution-net:
    driver: bridge
