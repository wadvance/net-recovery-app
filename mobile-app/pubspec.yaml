name: recovery_app
description: Equipment Recovery Management App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # HTTP & API
  dio: ^5.4.0
  json_annotation: ^4.8.1

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Navigation
  go_router: ^13.0.1

  # UI Components
  flutter_screenutil: ^5.9.0
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Forms & Validation
  reactive_forms: ^16.1.1

  # Location & Maps
  geolocator: ^11.0.0
  google_maps_flutter: ^2.5.3
  url_launcher: ^6.2.4
  maps_launcher: ^3.0.0+1

  # Camera & Images
  camera: ^0.10.5+9
  image_picker: ^1.0.7
  image_cropper: ^12.2.1
  signature: ^5.4.1

  # File handling
  file_picker: ^10.3.3
  path_provider: ^2.1.2

  # Notifications
  flutter_local_notifications: ^17.0.0
  firebase_messaging: ^14.7.10
  firebase_core: ^2.25.4

  # Utils
  intl: ^0.20.2
  connectivity_plus: ^7.0.0
  permission_handler: ^11.2.0
  package_info_plus: ^9.0.1
  device_info_plus: ^12.0.0

  # Excel
  excel: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/flags/
