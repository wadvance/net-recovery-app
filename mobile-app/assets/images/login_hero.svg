  <circle cx="190" cy="395" r="16" fill="#FFDCC0"/>
  <circle cx="410" cy="395" r="16" fill="#FFDCC0"/>

  <!-- Router (on top of box) -->
  <line x1="215" y1="268" x2="205" y2="238" stroke="#2D3A45" stroke-width="6" stroke-linecap="round"/>
  <line x1="263" y1="268" x2="253" y2="238" stroke="#2D3A45" stroke-width="6" stroke-linecap="round"/>
  <rect x="195" y="268" width="84" height="54" rx="7" fill="#2D3A45"/>
  <rect x="203" y="288" width="40" height="12" rx="3" fill="#00A3E0" fill-opacity="0.9"/>
  <circle cx="229" cy="305" r="5" fill="#00E5A8"/>
  <circle cx="247" cy="305" r="5" fill="#00A3E0"/>

  <!-- Modem (on top of box) -->
  <line x1="318" y1="286" x2="308" y2="252" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
  <rect x="300" y="286" width="95" height="52" rx="6" fill="#F4F6F8"/>
  <rect x="300" y="286" width="95" height="52" rx="6" fill="none" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="320" y="300" width="50" height="14" rx="3" fill="#E2E8F0"/>
  <circle cx="312" cy="322" r="5" fill="#00E5A8"/>
  <circle cx="330" cy="322" r="5" fill="#00A3E0"/>
  <circle cx="348" cy="322" r="5" fill="#94A3B8"/>

  <!-- Badge: rápido -->
  <g transform="translate(45, 108)">
    <rect width="150" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.95"/>
    <rect width="150" height="42" rx="21" fill="none" stroke="#00A3E0" stroke-opacity="0.15" stroke-width="2"/>
    <circle cx="22" cy="21" r="14" fill="#E3F6FF"/>
    <g transform="translate(22,21)">
      <path d="M-2 -9 L3 1 L0 1 L1 9 L-5 -1 L-2 -1 Z" fill="#00A3E0"/>
    </g>
    <text x="44" y="27" font-family="Poppins, sans-serif" font-size="15" font-weight="600" fill="#0077B6">rápido</text>
  </g>

  <!-- Badge: vamos a su casa -->
  <g transform="translate(385, 118)">
    <rect width="178" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.95"/>
    <rect width="178" height="42" rx="21" fill="none" stroke="#00A3E0" stroke-opacity="0.15" stroke-width="2"/>
    <circle cx="22" cy="21" r="14" fill="#E3F6FF"/>
    <g transform="translate(22,21)">
      <path d="M-8 3 L0 -7 L8 3 Z" fill="#00A3E0"/>
      <rect x="-4" y="2" width="8" height="6" fill="#FFFFFF"/>
    </g>
    <text x="44" y="27" font-family="Poppins, sans-serif" font-size="14" font-weight="600" fill="#0077B6">vamos a su casa</text>
  </g>

  <!-- Badge: confiable -->
  <g transform="translate(28, 300)">
    <rect width="158" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.95"/>
    <rect width="158" height="42" rx="21" fill="none" stroke="#00A3E0" stroke-opacity="0.15" stroke-width="2"/>
    <circle cx="22" cy="21" r="14" fill="#E3F6FF"/>
    <g transform="translate(22,21)">
      <path d="M-8 -8 L8 -8 L8 0 Q8 6 0 10 Q-8 6 -8 0 Z" fill="#00A3E0"/>
      <path d="M-3 0 L-1 2 L4 -4" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="44" y="27" font-family="Poppins, sans-serif" font-size="15" font-weight="600" fill="#0077B6">confiable</text>
  </g>

  <!-- Badge: coordinamos la cita -->
  <g transform="translate(392, 300)">
    <rect width="182" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.95"/>
    <rect width="182" height="42" rx="21" fill="none" stroke="#00A3E0" stroke-opacity="0.15" stroke-width="2"/>
    <circle cx="22" cy="21" r="14" fill="#E3F6FF"/>
    <g transform="translate(22,21)">
      <rect x="-8" y="-7" width="16" height="14" rx="2" fill="#00A3E0"/>
      <rect x="-4" y="-10" width="2" height="5" fill="#00A3E0"/>
      <rect x="2" y="-10" width="2" height="5" fill="#00A3E0"/>
      <rect x="-5" y="-3" width="10" height="6" rx="1" fill="#FFFFFF"/>
    </g>
    <text x="44" y="27" font-family="Poppins, sans-serif" font-size="13.5" font-weight="600" fill="#0077B6">coordinamos la cita</text>
  </g>

  <!-- Badge: seguro -->
  <g transform="translate(55, 470)">
    <rect width="138" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.95"/>
    <rect width="138" height="42" rx="21" fill="none" stroke="#00A3E0" stroke-opacity="0.15" stroke-width="2"/>
    <circle cx="22" cy="21" r="14" fill="#E3F6FF"/>
    <g transform="translate(22,21)">
      <rect x="-6" y="-3" width="12" height="10" rx="2" fill="#00A3E0"/>
      <path d="M-4 -3 L-4 -7 A4 4 0 0 1 4 -7 L4 -3" fill="none" stroke="#00A3E0" stroke-width="2.5"/>
      <circle cx="0" cy="1" r="1.6" fill="#FFFFFF"/>
    </g>
    <text x="44" y="27" font-family="Poppins, sans-serif" font-size="15" font-weight="600" fill="#0077B6">seguro</text>
  </g>

  <!-- Badge: entrega con constancia -->
  <g transform="translate(350, 478)">
    <rect width="215" height="42" rx="21" fill="#FFFFFF" fill-opacity="0.95"/>
    <rect width="215" height="42" rx="21" fill="none" stroke="#00A3E0" stroke-opacity="0.15" stroke-width="2"/>
    <circle cx="22" cy="21" r="14" fill="#E3F6FF"/>
    <g transform="translate(22,21)">
      <rect x="-8" y="-5" width="16" height="12" rx="2" fill="#00A3E0"/>
      <path d="M-8 -5 L0 -9 L8 -5" fill="none" stroke="#00A3E0" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M-3 1 L-1 3 L4 -3" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="44" y="27" font-family="Poppins, sans-serif" font-size="14" font-weight="600" fill="#0077B6">entrega con constancia</text>
  </g>
</svg>