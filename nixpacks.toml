[phases.setup]
nixPkgs = ["php83", "php83Packages.composer", "nginx"]

[phases.install]
cmds = ["cd backend && composer install --no-dev --optimize-autoloader"]

[phases.build]
cmds = ["cd backend && php artisan migrate --force"]

[start]
cmd = "cd backend && php artisan serve --host=0.0.0.0 --port=$PORT --no-reload"
